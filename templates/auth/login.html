<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Ship & Earn</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <link rel="stylesheet" href="/static/tailwind.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EPNEVLF3LP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-EPNEVLF3LP');
  </script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm px-4">
    <div class="text-center mb-8">
      <a href="/" class="text-3xl font-bold text-white tracking-tight">Ship & Earn</a>
      <p class="text-slate-400 text-sm mt-1">income command centre</p>
    </div>
    <div class="bg-white rounded-2xl p-8 shadow-xl">
      <h1 class="text-xl font-bold text-slate-900 mb-6">Sign in</h1>
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="mb-4 px-4 py-2 rounded-lg text-sm
                    {% if category == 'error' %}bg-red-50 text-red-700 border border-red-200
                    {% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
          {{ message }}
        </div>
        {% endfor %}
      {% endif %}
      {% endwith %}
      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label class="text-xs text-slate-500 font-medium">Email</label>
          <input name="email" type="email" required autofocus
                 class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-900 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div>
          <label class="text-xs text-slate-500 font-medium">Password</label>
          <input name="password" type="password" required
                 class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-900 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 text-white text-sm py-2.5 rounded-lg hover:bg-indigo-700 transition-colors font-medium">
          Sign in
        </button>
      </form>
      <p class="text-center text-xs text-slate-400 mt-6">
        No account? <a href="/signup" class="text-indigo-600 hover:underline">Sign up free</a>
      </p>
    </div>
  </div>
</body>
</html>
