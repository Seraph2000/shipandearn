services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: earnstack
      POSTGRES_USER: earnstack
      POSTGRES_PASSWORD: earnstack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://earnstack:earnstack@db:5432/earnstack
    ports:
      - "5000:8000"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
