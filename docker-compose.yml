services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shipandearn
      POSTGRES_USER: shipandearn
      POSTGRES_PASSWORD: shipandearn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipandearn"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: shipandearn:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shipandearn:shipandearn@db:5432/shipandearn
    ports:
      - "5000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
